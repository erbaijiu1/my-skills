server {
    listen 80;
    server_name localhost;

    # Gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript;

    # 1. 前端页面路由匹配: /{project_name}/html/
    location /{project_name}/html/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /{project_name}/html/index.html;
        index index.html index.htm;
    }

    # 2. 后端 API 路由转发: /{project_name}/api/
    location /{project_name}/api/ {
        proxy_pass http://{project_name}-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. 静态资源路由转发: /{project_name}/static/
    location /{project_name}/static/ {
        proxy_pass http://{project_name}-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
